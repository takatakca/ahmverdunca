name: AHMV Voice DB dry-run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AHMV-VOICE-DB-DRY-RUN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ahmv-voice-db-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      SUPABASE_PROJECT_REF: bqflllsjxmhqsvemhhwv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.AHMV_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.AHMV_SUPABASE_DB_PASSWORD }}

    steps:
      - name: Validate explicit dry-run intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "AHMV-VOICE-DB-DRY-RUN" || {
            echo "Refusing to continue without the exact dry-run confirmation."
            exit 1
          }

      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Verify AHMV database identity locally
        run: bun run doctor:voice-db

      - name: Verify Supabase credentials are present
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing production secret AHMV_SUPABASE_ACCESS_TOKEN"
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing production secret AHMV_SUPABASE_DB_PASSWORD"
            exit 1
          }

      - name: Verify pinned Supabase CLI
        run: npx --yes supabase@2.119.0 --version

      - name: Link exact AHMV project
        run: npx --yes supabase@2.119.0 link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show local versus remote migration history
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 migration list --linked | tee voice-migration-list.txt
          grep -q '20261003091000' voice-migration-list.txt || {
            echo "Voice session migration is missing from the migration list."
            exit 1
          }

      - name: Preview database changes only
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 db push --linked --dry-run | tee voice-db-dry-run.txt
          echo "Dry-run completed. No database migration was applied."

      - name: Guard against accidental mutation commands
        run: |
          set -euo pipefail
          test -s voice-migration-list.txt
          test -s voice-db-dry-run.txt
          echo "This workflow intentionally contains no non-dry-run db push step."
