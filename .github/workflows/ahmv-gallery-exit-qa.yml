name: AHMV Gallery Exit QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/media/media-luxury-viewer.tsx"
      - "scripts/visual-smoke-gallery-exit.py"
      - ".github/workflows/ahmv-gallery-exit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Chromium for real browser tests
        run: |
          python3 -m venv /tmp/ahmv-gallery-playwright
          /tmp/ahmv-gallery-playwright/bin/pip install --disable-pip-version-check playwright==1.55.0
          /tmp/ahmv-gallery-playwright/bin/python -m playwright install --with-deps chromium
      - name: Start AHMV application for browser QA
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/ahmv-gallery-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/galerie/hockey-feminin-2026-2027 >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/ahmv-gallery-server.log
          exit 1
      - name: Click exit, reopen and press Escape on real gallery
        env:
          AHMV_VISUAL_BASE_URL: http://127.0.0.1:8080
        run: /tmp/ahmv-gallery-playwright/bin/python scripts/visual-smoke-gallery-exit.py
      - name: Gallery screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ahmv-gallery-exit-${{ github.run_number }}
          path: artifacts/ahmv-gallery-exit/
          if-no-files-found: warn
          retention-days: 14
