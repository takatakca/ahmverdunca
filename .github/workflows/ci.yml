name: AHM Verdun CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene
        run: |
          tracked_env_files="$(git ls-files '.env' '.env.*' ':!.env.example')"
          if [ -n "$tracked_env_files" ]; then
            echo "Runtime environment files must not be committed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Validate content data
        run: bun run check:data

      - name: Validate public SEO artifacts
        run: bun run check:seo

      - name: Validate runtime response policy
        run: bun run check:runtime-policy

      - name: Validate canonical SEO coverage
        run: bun run check:canonical

      - name: Validate external-link safety
        run: bun run check:external-links

      - name: Lint application logic
        run: |
          bunx eslint . --rule 'prettier/prettier: off'

      - name: Build
        run: bun run build
