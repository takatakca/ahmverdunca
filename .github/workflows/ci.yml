name: AHM Verdun CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository hygiene
        run: |
          tracked_env_files="$(git ls-files '.env' '.env.*' ':!.env.example')"
          if [ -n "$tracked_env_files" ]; then
            echo "Runtime environment files must not be committed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: AHMV phone and SMS security tests
        run: bun run test:phone

      - name: GROUPE TAKATAK team feed security tests
        run: bun run test:team-feed

      - name: AHMV assistant routing tests
        run: bun run test:assistant

      - name: Validate monetization configuration
        run: bun run check:monetization

      - name: Validate Parent Premium contract
        run: bun run check:parent-premium

      - name: Validate content data
        run: bun run check:data

      - name: Validate public SEO artifacts
        run: bun run check:seo

      - name: Validate runtime response policy
        run: bun run check:runtime-policy

      - name: Validate mobile navigation contract
        run: bun run check:mobile-nav

      - name: Validate Supabase public-key safety
        run: bun run check:supabase-key-safety

      - name: Validate no-synthetic-media policy
        run: bun run check:media-policy

      - name: Validate canonical SEO coverage
        run: bun run check:canonical

      - name: Validate external-link safety
        run: bun run check:external-links

      - name: Lint application logic
        run: |
          bunx eslint . --rule 'prettier/prettier: off'

      - name: Production deployment smoke safeguards
        run: |
          bash -n scripts/deploy-production-http-smoke.sh
          bun run test:deploy-smoke

      - name: Standalone Voice runtime
        working-directory: services/ahmv-voice-ai
        run: |
          npm ci --ignore-scripts --audit=false --fund=false
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Build
        run: bun run build

      - name: Validate production release artifact
        run: bun run check:release-artifact
