name: Finalize AHMV gallery logo asset

on:
  push:
    branches:
      - website-production-logo-gallery-2026
    paths:
      - .github/workflows/import-ahmv-logo.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: website-production-logo-gallery-2026
          fetch-depth: 0

      - name: Convert exact Gallery logo to PNG
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("public/branding/ahmv-logo-gallery-2026.jpg")
          image = Image.open(src).convert("RGB")
          image.save("public/branding/ahmv-logo-gallery-2026.png", "PNG", optimize=True)
          image.save("public/favicon.png", "PNG", optimize=True)
          print(image.size)
          PY
          file public/branding/ahmv-logo-gallery-2026.png
          file public/favicon.png

      - name: Commit finalized logo assets
        run: |
          set -euo pipefail
          git config user.name "AHMV Media Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/branding/ahmv-logo-gallery-2026.png public/favicon.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(brand): finalize Gallery logo assets"
          git push origin HEAD:website-production-logo-gallery-2026
