name: Deploy AHMV Voice runtime preproduction

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact green voice-ai-preprod-v6 commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type AHMV-VOICE-RUNTIME-PREPROD"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ahmverdun-voice-runtime-preproduction
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: voice-preproduction
    timeout-minutes: 25

    env:
      VOICE_HOST: ${{ secrets.AHMV_VOICE_PREPROD_HOST }}
      VOICE_PORT: ${{ secrets.AHMV_VOICE_PREPROD_SSH_PORT }}
      VOICE_USER: ${{ secrets.AHMV_VOICE_PREPROD_USER }}
      VOICE_APP_ROOT: ${{ secrets.AHMV_VOICE_PREPROD_APP_ROOT }}
      VOICE_PREPROD_URL: ${{ secrets.AHMV_VOICE_PREPROD_URL }}

    steps:
      - name: Validate requested runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "AHMV-VOICE-RUNTIME-PREPROD" || {
            echo "Exact confirmation AHMV-VOICE-RUNTIME-PREPROD is required."
            exit 1
          }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a full lowercase 40-character SHA"
            exit 1
          }
          VOICE_HEAD="$(gh api repos/${GITHUB_REPOSITORY}/commits/voice-ai-preprod-v6 --jq .sha)"
          test "$REQUESTED_SHA" = "$VOICE_HEAD" || {
            echo "Refusing stale/non-Voice head: requested=$REQUESTED_SHA voice_head=$VOICE_HEAD"
            exit 1
          }
          SUCCESSFUL_CI_RUNS="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$REQUESTED_SHA&status=success&per_page=10" --jq '.workflow_runs | length'
          )"
          test "$SUCCESSFUL_CI_RUNS" -gt 0 || {
            echo "No successful AHM Verdun CI exists for $REQUESTED_SHA"
            exit 1
          }

      - name: Checkout exact Voice runtime release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify standalone runtime
        working-directory: services/ahmv-voice-ai
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --audit=false --fund=false
          npm run verify
          npm audit --omit=dev --audit-level=high

      - name: Verify deployment configuration
        run: |
          set -euo pipefail
          for name in VOICE_HOST VOICE_PORT VOICE_USER VOICE_APP_ROOT VOICE_PREPROD_URL; do
            test -n "${!name:-}" || { echo "Missing required secret-backed value: $name"; exit 1; }
          done
          [[ "$VOICE_PORT" =~ ^[0-9]+$ ]] || { echo "SSH port must be numeric"; exit 1; }
          [[ "$VOICE_APP_ROOT" = /* ]] || { echo "Voice app root must be absolute"; exit 1; }
          [[ "$VOICE_PREPROD_URL" =~ ^https://([A-Za-z0-9-]+\.)*ahmverdun\.ca$ ]] || {
            echo "Voice preproduction URL must be an HTTPS ahmverdun.ca origin"
            exit 1
          }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AHMV_VOICE_PREPROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.AHMV_VOICE_PREPROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package immutable standalone runtime
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_SHA" > services/ahmv-voice-ai/RELEASE_SHA
          tar             --exclude='node_modules'             --exclude='sbom.cdx.json'             -C services/ahmv-voice-ai             -czf "ahmv-voice-runtime-$RELEASE_SHA.tar.gz" .

      - name: Capture previous runtime release
        run: |
          set -euo pipefail
          PREVIOUS="$(ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST" "readlink '$VOICE_APP_ROOT/current' 2>/dev/null || true")"
          echo "previous_voice_release=$PREVIOUS" >> "$GITHUB_ENV"

      - name: Upload and install runtime release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST"             "mkdir -p '$VOICE_APP_ROOT/releases/$RELEASE_SHA'"
          scp -P "$VOICE_PORT" "ahmv-voice-runtime-$RELEASE_SHA.tar.gz"             "$VOICE_USER@$VOICE_HOST:$VOICE_APP_ROOT/releases/$RELEASE_SHA/release.tar.gz"
          ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST"             "set -e; cd '$VOICE_APP_ROOT/releases/$RELEASE_SHA'; tar -xzf release.tar.gz; rm release.tar.gz; npm ci --omit=dev --ignore-scripts --audit=false --fund=false; node --check src/server.js; ln -sfn '$VOICE_APP_ROOT/releases/$RELEASE_SHA' '$VOICE_APP_ROOT/current'"

      - name: Restart Voice runtime
        env:
          RESTART_COMMAND: ${{ secrets.AHMV_VOICE_PREPROD_RESTART_COMMAND }}
        run: |
          set -euo pipefail
          test -n "$RESTART_COMMAND" || {
            echo "Missing AHMV_VOICE_PREPROD_RESTART_COMMAND"
            exit 1
          }
          ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST" "$RESTART_COMMAND"

      - name: Verify Voice runtime health and readiness
        run: |
          set -euo pipefail
          sleep 4
          HEALTH="$(mktemp)"
          READY="$(mktemp)"
          curl --fail --silent --show-error --retry 5 --retry-delay 2             -o "$HEALTH" "$VOICE_PREPROD_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 2             -o "$READY" "$VOICE_PREPROD_URL/readyz"
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' "$HEALTH" || {
            echo "Voice runtime health check did not report ok=true"
            cat "$HEALTH"
            exit 1
          }
          grep -q '"ready"[[:space:]]*:[[:space:]]*true' "$READY" || {
            echo "Voice runtime readiness did not report ready=true"
            cat "$READY"
            exit 1
          }
          echo "Voice runtime preproduction is healthy and ready."

      - name: Roll back failed Voice runtime activation
        if: failure() && env.previous_voice_release != ''
        env:
          RESTART_COMMAND: ${{ secrets.AHMV_VOICE_PREPROD_RESTART_COMMAND }}
        run: |
          set -euo pipefail
          echo "Restoring previous Voice runtime release."
          ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST"             "ln -sfn '$previous_voice_release' '$VOICE_APP_ROOT/current'"
          ssh -p "$VOICE_PORT" "$VOICE_USER@$VOICE_HOST" "$RESTART_COMMAND"
