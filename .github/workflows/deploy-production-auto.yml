name: Auto deploy AHM Verdun production

on:
  workflow_run:
    workflows:
      - AHM Verdun CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ahmverdun-production-auto
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      AHMV_HOST: ${{ secrets.AHMV_PRODUCTION_HOST }}
      AHMV_PORT: ${{ secrets.AHMV_PRODUCTION_SSH_PORT }}
      AHMV_USER: ${{ secrets.AHMV_PRODUCTION_USER }}
      AHMV_APP_ROOT: ${{ secrets.AHMV_PRODUCTION_APP_ROOT }}
      AHMV_PRODUCTION_URL: ${{ secrets.AHMV_PRODUCTION_URL }}
      VITE_PUBLIC_INDEXING: ${{ vars.AHMV_PUBLIC_INDEXING || 'false' }}

    steps:
      - name: Checkout exact green release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full release gate
        run: |
          set -euo pipefail

          bunx tsc --noEmit
          bun test scripts/ahmv-phone.test.ts
          bun run test:team-feed
          bun run test:assistant
          bun run check:monetization
          bun run check:data
          bun run check:seo
          bun run check:runtime-policy
          bun run check:mobile-nav
          bun run check:supabase-key-safety
          bun run check:media-policy
          bun run check:canonical
          bun run check:external-links
          bunx eslint . --rule 'prettier/prettier: off'
          bun run build
          bun run check:release-artifact

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          for name in \
            AHMV_HOST \
            AHMV_PORT \
            AHMV_USER \
            AHMV_APP_ROOT \
            AHMV_PRODUCTION_URL
          do
            test -n "${!name:-}" || {
              echo "ERROR: Missing required value: $name"
              exit 1
            }
          done

          [[ "$AHMV_PORT" =~ ^[0-9]+$ ]] || {
            echo "ERROR: SSH port must be numeric."
            exit 1
          }

          [[ "$AHMV_APP_ROOT" = /* ]] || {
            echo "ERROR: Application root must be an absolute path."
            exit 1
          }

          [[ "$AHMV_PRODUCTION_URL" =~ ^https://[^/]+$ ]] || {
            echo "ERROR: Production URL must be a HTTPS origin without a trailing path."
            exit 1
          }

          if [ "$AHMV_PRODUCTION_URL" != "https://ahmverdun.ca" ]; then
            echo "ERROR: AHMV_PRODUCTION_URL must be exactly:"
            echo "https://ahmverdun.ca"
            exit 1
          fi

          echo "Deployment configuration validated."

      - name: Configure resilient SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AHMV_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.AHMV_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "ERROR: AHMV_PRODUCTION_SSH_PRIVATE_KEY is empty."
            exit 1
          }

          test -n "$KNOWN_HOSTS" || {
            echo "ERROR: AHMV_PRODUCTION_KNOWN_HOSTS is empty."
            exit 1
          }

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host ahmv-production
            HostName ${AHMV_HOST}
            User ${AHMV_USER}
            Port ${AHMV_PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 4
            TCPKeepAlive yes
          EOF

          chmod 600 ~/.ssh/config

          cat > "$RUNNER_TEMP/ahmv-ssh" <<'EOF'
          #!/usr/bin/env bash

          set -uo pipefail

          MAX_ATTEMPTS=10
          attempt=1
          last_status=255

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "SSH attempt ${attempt}/${MAX_ATTEMPTS}..." >&2

            set +e
            ssh ahmv-production "$@"
            last_status=$?
            set -e

            if [ "$last_status" -eq 0 ]; then
              exit 0
            fi

            echo "SSH attempt ${attempt} failed with exit code ${last_status}." >&2

            if [ "$last_status" -ne 255 ]; then
              echo "Remote command failed with a non-transport error. Not retrying." >&2
              exit "$last_status"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$((attempt * 10))
              if [ "$delay" -gt 60 ]; then delay=60; fi
              echo "Transient SSH failure detected. Waiting ${delay} seconds for the hosting SSH window..." >&2
              sleep "$delay"
            fi

            attempt=$((attempt + 1))
          done

          echo "SSH connection failed after ${MAX_ATTEMPTS} attempts." >&2
          exit "$last_status"
          EOF

          chmod +x "$RUNNER_TEMP/ahmv-ssh"

          cat > "$RUNNER_TEMP/ahmv-scp" <<'EOF'
          #!/usr/bin/env bash

          set -uo pipefail

          MAX_ATTEMPTS=10
          attempt=1
          last_status=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "SCP attempt ${attempt}/${MAX_ATTEMPTS}..." >&2

            set +e
            scp "$@"
            last_status=$?
            set -e

            if [ "$last_status" -eq 0 ]; then
              exit 0
            fi

            echo "SCP attempt ${attempt} failed with exit code ${last_status}." >&2

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$((attempt * 10))
              if [ "$delay" -gt 60 ]; then delay=60; fi
              echo "Retrying SCP transfer in ${delay} seconds..." >&2
              sleep "$delay"
            fi

            attempt=$((attempt + 1))
          done

          echo "SCP transfer failed after ${MAX_ATTEMPTS} attempts." >&2
          exit "$last_status"
          EOF

          chmod +x "$RUNNER_TEMP/ahmv-scp"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test production SSH connection
        run: |
          set -euo pipefail

          echo "Testing production SSH connection..."

          ahmv-ssh \
            "printf 'AHM Verdun production SSH connection OK\n'"

          echo "Production SSH connection verified."

      - name: Create immutable release package
        run: |
          set -euo pipefail

          RELEASE_KEY="${RELEASE_SHA}-${GITHUB_RUN_ID}"

          echo "RELEASE_KEY=$RELEASE_KEY" >> "$GITHUB_ENV"

          printf '%s\n' "$RELEASE_SHA" > .output/RELEASE_SHA
          printf '%s\n' "$RELEASE_KEY" > .output/RELEASE_KEY

          tar \
            -C .output \
            -czf "ahmverdun-${RELEASE_KEY}.tar.gz" \
            .

          sha256sum \
            "ahmverdun-${RELEASE_KEY}.tar.gz" \
            > "ahmverdun-${RELEASE_KEY}.sha256"

          test -s "ahmverdun-${RELEASE_KEY}.tar.gz"
          test -s "ahmverdun-${RELEASE_KEY}.sha256"

          echo "Release package created:"
          ls -lh \
            "ahmverdun-${RELEASE_KEY}.tar.gz" \
            "ahmverdun-${RELEASE_KEY}.sha256"

      - name: Capture previous release
        run: |
          set -euo pipefail

          echo "Reading current production release..."

          PREVIOUS="$(
            ahmv-ssh \
              "if [ -L '$AHMV_APP_ROOT/current' ]; then
                 readlink '$AHMV_APP_ROOT/current'
               fi"
          )"

          PREVIOUS="$(
            printf '%s' "$PREVIOUS" |
            tr -d '\r\n'
          )"

          if [ -n "$PREVIOUS" ]; then
            echo "Previous release detected."
            echo "previous_release=$PREVIOUS" >> "$GITHUB_ENV"
          else
            echo "No previous release detected."
            echo "This appears to be the first deployment using this release structure."
            echo "previous_release=" >> "$GITHUB_ENV"
          fi

      - name: Prepare remote release directory
        run: |
          set -euo pipefail

          ahmv-ssh \
            "mkdir -p '$AHMV_APP_ROOT/releases/$RELEASE_KEY'"

      - name: Upload release
        run: |
          set -euo pipefail

          echo "Uploading release package..."

          ahmv-scp \
            "ahmverdun-${RELEASE_KEY}.tar.gz" \
            "ahmv-production:$AHMV_APP_ROOT/releases/$RELEASE_KEY/release.tar.gz"

          echo "Release package uploaded."

      - name: Extract release
        run: |
          set -euo pipefail

          echo "Extracting release on production server..."

          ahmv-ssh \
            "set -e
             cd '$AHMV_APP_ROOT/releases/$RELEASE_KEY'
             test -s release.tar.gz
             tar -xzf release.tar.gz
             rm -f release.tar.gz
             test -f RELEASE_SHA
             test -f RELEASE_KEY
             test -d server
             test -d public
             test -f server/index.mjs || test -f server/index.js"

          echo "Remote release extracted and validated."

      - name: Verify uploaded release marker
        run: |
          set -euo pipefail

          REMOTE_SHA="$(
            ahmv-ssh \
              "cat '$AHMV_APP_ROOT/releases/$RELEASE_KEY/RELEASE_SHA'"
          )"

          REMOTE_SHA="$(
            printf '%s' "$REMOTE_SHA" |
            tr -d '\r\n'
          )"

          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "ERROR: Uploaded release SHA does not match expected SHA."
            echo "Expected: $RELEASE_SHA"
            echo "Received: $REMOTE_SHA"
            exit 1
          fi

          REMOTE_RELEASE_KEY="$(
            ahmv-ssh \
              "cat '$AHMV_APP_ROOT/releases/$RELEASE_KEY/RELEASE_KEY'"
          )"

          REMOTE_RELEASE_KEY="$(
            printf '%s' "$REMOTE_RELEASE_KEY" |
            tr -d '\r\n'
          )"

          if [ "$REMOTE_RELEASE_KEY" != "$RELEASE_KEY" ]; then
            echo "ERROR: Uploaded release key does not match expected release key."
            echo "Expected: $RELEASE_KEY"
            echo "Received: $REMOTE_RELEASE_KEY"
            exit 1
          fi

          echo "Uploaded release markers verified."

      - name: Activate release
        run: |
          set -euo pipefail

          echo "Activating production release..."

          ahmv-ssh \
            "set -e
             rm -f '$AHMV_APP_ROOT/current.new'
             ln -s '$AHMV_APP_ROOT/releases/$RELEASE_KEY' '$AHMV_APP_ROOT/current.new'
             mv -Tf '$AHMV_APP_ROOT/current.new' '$AHMV_APP_ROOT/current'"

          echo "Release activated."

      - name: Verify active release marker
        run: |
          set -euo pipefail

          ACTIVE_SHA="$(
            ahmv-ssh \
              "cat '$AHMV_APP_ROOT/current/RELEASE_SHA'"
          )"

          ACTIVE_SHA="$(
            printf '%s' "$ACTIVE_SHA" |
            tr -d '\r\n'
          )"

          if [ "$ACTIVE_SHA" != "$RELEASE_SHA" ]; then
            echo "ERROR: Active release SHA does not match deployment SHA."
            echo "Expected: $RELEASE_SHA"
            echo "Received: $ACTIVE_SHA"
            exit 1
          fi

          ACTIVE_RELEASE_KEY="$(
            ahmv-ssh \
              "cat '$AHMV_APP_ROOT/current/RELEASE_KEY'"
          )"

          ACTIVE_RELEASE_KEY="$(
            printf '%s' "$ACTIVE_RELEASE_KEY" |
            tr -d '\r\n'
          )"

          if [ "$ACTIVE_RELEASE_KEY" != "$RELEASE_KEY" ]; then
            echo "ERROR: Active release key does not match deployment release key."
            echo "Expected: $RELEASE_KEY"
            echo "Received: $ACTIVE_RELEASE_KEY"
            exit 1
          fi

          echo "Active production release verified."

      - name: Restart Passenger
        run: |
          set -euo pipefail

          echo "Requesting Passenger restart..."

          ahmv-ssh \
            "mkdir -p '$AHMV_APP_ROOT/tmp' &&
             touch '$AHMV_APP_ROOT/tmp/restart.txt'"

          echo "Passenger restart requested."

      - name: Verify health
        run: |
          set -euo pipefail

          echo "Waiting for application restart..."
          sleep 5

          echo "Checking:"
          echo "$AHMV_PRODUCTION_URL/healthz"

          HEALTH_BODY="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 30 \
              --retry 8 \
              --retry-delay 3 \
              --retry-all-errors \
              "$AHMV_PRODUCTION_URL/healthz"
          )"

          echo "$HEALTH_BODY"

          printf '%s' "$HEALTH_BODY" |
            grep -q '"ok"[[:space:]]*:[[:space:]]*true' || {
              echo "ERROR: Health endpoint did not report ok=true."
              exit 1
            }

          printf '%s' "$HEALTH_BODY" |
            grep -q '"service"[[:space:]]*:[[:space:]]*"ahmverdun-web"' || {
              echo "ERROR: Health endpoint returned an unexpected service name."
              exit 1
            }

          echo "Production health check passed."

      - name: Verify production homepage
        run: |
          set -euo pipefail

          HEADERS="$(mktemp)"
          BODY="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            -D "$HEADERS" \
            -o "$BODY" \
            "$AHMV_PRODUCTION_URL/"

          echo "Checking production security headers..."

          grep -qi '^x-content-type-options:[[:space:]]*nosniff' "$HEADERS" || {
            echo "ERROR: Missing X-Content-Type-Options: nosniff"
            cat "$HEADERS"
            exit 1
          }

          grep -qi '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "$HEADERS" || {
            echo "ERROR: Missing Referrer-Policy: strict-origin-when-cross-origin"
            cat "$HEADERS"
            exit 1
          }

          grep -qi '^x-frame-options:[[:space:]]*SAMEORIGIN' "$HEADERS" || {
            echo "ERROR: Missing X-Frame-Options: SAMEORIGIN"
            cat "$HEADERS"
            exit 1
          }

          if [ "$VITE_PUBLIC_INDEXING" = "true" ]; then
            if grep -qi '^x-robots-tag:.*noindex' "$HEADERS"; then
              echo "ERROR: Production homepage is unexpectedly noindex."
              cat "$HEADERS"
              exit 1
            fi

            echo "Public indexing is enabled and homepage is indexable."
          else
            grep -qi '^x-robots-tag:.*noindex' "$HEADERS" || {
              echo "ERROR: Public indexing is disabled but homepage is not protected by noindex."
              cat "$HEADERS"
              exit 1
            }

            echo "Public indexing is disabled and homepage is correctly noindex."
          fi

          test -s "$BODY" || {
            echo "ERROR: Production homepage returned an empty body."
            exit 1
          }

          if grep -Fq '/__l5e/' "$BODY"; then
            echo "ERROR: Production HTML still references a Lovable-only /__l5e/ asset path."
            grep -Fo '/__l5e/[^"[:space:]]*' "$BODY" | head -20 || true
            exit 1
          fi

          ASSET_PATHS="$(
            find .output/public -type f \( -name '*.css' -o -name '*.js' \) -print |
            sed 's#^\.output/public##' |
            sort -u
          )"

          test -n "$ASSET_PATHS" || {
            echo "ERROR: Production build contains no public CSS/JS assets."
            exit 1
          }

          echo "Checking production CSS/JS assets from the exact release artifact..."
          while IFS= read -r asset; do
            test -n "$asset" || continue
            echo "  $asset"
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 --retry 5 --retry-delay 2 --retry-all-errors -o /dev/null "$AHMV_PRODUCTION_URL$asset"
          done <<< "$ASSET_PATHS"

          echo "Production homepage and exact release CSS/JS asset verification passed."

      - name: Verify search remains noindex
        run: |
          set -euo pipefail

          HEADERS="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            -D "$HEADERS" \
            -o /dev/null \
            "$AHMV_PRODUCTION_URL/recherche"

          grep -qi '^x-robots-tag:.*noindex' "$HEADERS" || {
            echo "ERROR: /recherche must remain noindex."
            cat "$HEADERS"
            exit 1
          }

          echo "/recherche remains correctly protected by noindex."

      - name: Verify robots.txt
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$AHMV_PRODUCTION_URL/robots.txt" \
            -o "$RUNNER_TEMP/robots.txt"

          test -s "$RUNNER_TEMP/robots.txt" || {
            echo "ERROR: robots.txt is empty."
            exit 1
          }

          echo "robots.txt verification passed."

      - name: Verify sitemap.xml
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$AHMV_PRODUCTION_URL/sitemap.xml" \
            -o "$RUNNER_TEMP/sitemap.xml"

          test -s "$RUNNER_TEMP/sitemap.xml" || {
            echo "ERROR: sitemap.xml is empty."
            exit 1
          }

          grep -q 'https://ahmverdun.ca' "$RUNNER_TEMP/sitemap.xml" || {
            echo "ERROR: sitemap.xml does not contain the correct ahmverdun.ca domain."
            exit 1
          }

          echo "sitemap.xml verification passed."

      - name: Roll back failed deployment
        if: failure()
        run: |
          set -euo pipefail

          if [ -z "${previous_release:-}" ]; then
            echo "No previous release was captured."
            echo "Automatic rollback is not possible."
            exit 0
          fi

          echo "Deployment failed."
          echo "Rolling back to previous release:"
          echo "$previous_release"

          ahmv-ssh \
            "set -e
             test -e '$previous_release'
             rm -f '$AHMV_APP_ROOT/current.new'
             ln -s '$previous_release' '$AHMV_APP_ROOT/current.new'
             mv -Tf '$AHMV_APP_ROOT/current.new' '$AHMV_APP_ROOT/current'
             mkdir -p '$AHMV_APP_ROOT/tmp'
             touch '$AHMV_APP_ROOT/tmp/restart.txt'"

          echo "Previous release restored."
          echo "Waiting for Passenger restart..."
          sleep 5

          echo "Verifying rollback health..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            "$AHMV_PRODUCTION_URL/healthz"

          echo
          echo "Rollback completed successfully."

      - name: Keep newest five releases
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "Cleaning old releases..."

          ahmv-ssh \
            "set -e
             mkdir -p '$AHMV_APP_ROOT/releases'
             cd '$AHMV_APP_ROOT/releases'
             ls -1dt */ 2>/dev/null |
             tail -n +6 |
             xargs -r rm -rf"

          echo "Old release cleanup completed."

      - name: Deployment summary
        if: success()
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AHM VERDUN PRODUCTION DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo
          echo "Domain:"
          echo "$AHMV_PRODUCTION_URL"
          echo
          echo "Release SHA:"
          echo "$RELEASE_SHA"
          echo
          echo "Release key:"
          echo "$RELEASE_KEY"
          echo
          echo "Health:"
          echo "$AHMV_PRODUCTION_URL/healthz"
          echo
          echo "Production deployment completed successfully."
