name: Import AHMV Runway ad contact sheets

on:
  push:
    branches:
      - website-production-runway-ad-import
    paths:
      - .github/workflows/import-ahmv-runway-ads.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: website-production-runway-ad-import
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download confirmed Runway contact sheets
        env:
          SHEET_1: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/cdf3eacc-d5ef-43a9-9170-fd09a69f3a65/Create_one_16_9_advertising_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ad_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTU5ODU4OTViOGJhZDVjZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIwMDUzM30.9Y659QxW5tDjm0cw5p5FPqzANqT892aq7D9xBQWMdrI"
          SHEET_2: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/80ba8512-3ee7-402a-9741-23df35625df9/Create_one_16_9_advertising_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ad_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjNkNDMxZThiNmZjOTRhNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIzMTU5Mn0.uQBAgMsCCembUaMag7f38fRFjxpniUMb0DPFY2l2CRc"
          SHEET_3: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/dc57ad21-987e-44d2-8e8b-43ff90ddb56b/Create_one_16_9_advertising_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ad_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWI2MTA5ZDQ1YTNlODE5OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIwMjY0NH0.TgVXXqCAi2p094bcnrYTYKMZj0cyjXfCYj9oWOD2k1o"
          SHEET_4: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/43cdc160-6da4-4736-b235-509d9b103634/Create_one_16_9_advertising_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ad_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTdhYjAxMzUyN2ZlZmZjMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIzMzMzM30.ljh63AQWB0ntGknDftwp3F3SNX6fAJ1yfQh3OmSGkv4"
          SHEET_5: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/21a02de9-c674-49e9-80f9-881bc490579c/Create_one_16_9_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ads__clean_gut_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWZmMjc5YzllY2RkZDc3ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIwMzc4NX0.5tPHSd7GLRJd3FEVSP2hC9uHhTv7oH7n5ZeUKfUOdo0"
          SHEET_6: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/01a78d6e-bc55-46bd-812e-c90ac9d6a64c/Create_one_16_9_advertising_contact_sheet_with_EXACTLY_a_3x3_grid_of_nine_equal_landscape_sponsor_ad_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTFiZjA4YzU1NWZjYjIwMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTI0NDk5N30.RoMt3mafGxIGgaDG1A3x2p3yzDtsY-mLsurUJB_t7uI"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ahmv-runway
          for n in 1 2 3 4 5 6; do
            var="SHEET_${n}"
            url="${!var}"
            echo "Downloading contact sheet ${n}..."
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2               "$url" -o "/tmp/ahmv-runway/sheet-${n}.png"
            test -s "/tmp/ahmv-runway/sheet-${n}.png"
          done

      - name: Split each 3x3 sheet into nine exact tiles
        run: |
          set -euo pipefail
          mkdir -p public/sponsor-creatives/runway
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          output = Path("public/sponsor-creatives/runway")
          manifest = []
          for sheet_number in range(1, 7):
              src = Path(f"/tmp/ahmv-runway/sheet-{sheet_number}.png")
              image = Image.open(src).convert("RGB")
              width, height = image.size
              for row in range(3):
                  for col in range(3):
                      index = row * 3 + col + 1
                      left = round(col * width / 3)
                      right = round((col + 1) * width / 3)
                      top = round(row * height / 3)
                      bottom = round((row + 1) * height / 3)
                      tile = image.crop((left, top, right, bottom))
                      filename = f"runway-sheet-{sheet_number}-tile-{index:02d}.jpg"
                      tile.save(output / filename, "JPEG", quality=94, optimize=True)
                      manifest.append({
                          "id": f"runway-s{sheet_number}-t{index:02d}",
                          "sheet": sheet_number,
                          "tile": index,
                          "row": row + 1,
                          "column": col + 1,
                          "path": f"/sponsor-creatives/runway/{filename}",
                          "status": "needs-sponsor-classification"
                      })

          (output / "manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          print(f"Created {len(manifest)} individual ad tiles.")
          PY
          test "$(find public/sponsor-creatives/runway -name 'runway-sheet-*-tile-*.jpg' | wc -l)" -eq 54

      - name: Commit imported creative tiles
        run: |
          set -euo pipefail
          git config user.name "AHMV Creative Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sponsor-creatives/runway
          git diff --cached --quiet && exit 0
          git commit -m "chore(ads): import 54 Runway creative tiles"
          git push origin HEAD:website-production-runway-ad-import
